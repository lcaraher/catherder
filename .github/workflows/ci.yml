name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A second merge queues behind a running deploy instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catherder
          POSTGRES_PASSWORD: catherder
          POSTGRES_DB: catherder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catherder -d catherder"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://catherder:catherder@localhost:5432/catherder

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  plan:
    # A fork's pull request gets no OIDC token, so it is skipped rather than failed.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infra/aws/app

    steps:
      - uses: actions/checkout@v7

      # Prints the subject claim only; the token itself is never echoed.
      - name: Show the OIDC subject this job was issued
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          printf '%s' "$token" | cut -d. -f2 | python3 -c "import base64, json, sys; s = sys.stdin.read().strip(); s += '=' * (-len(s) % 4); print('sub:', json.loads(base64.urlsafe_b64decode(s))['sub'])"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - run: terraform init -input=false -backend-config backend.dev.hcl

      # No lock: the plan role can only read, and a plan needs none.
      - run: terraform plan -input=false -lock=false -no-color -var-file dev.tfvars

  build:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        target: [app, migrate]

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PUSH_ROLE_ARN }}
          aws-region: us-east-2

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # Tags are immutable, so a re-run of an already pushed commit skips the push instead of failing.
      # Without --provenance=false --sbom=false buildx wraps the image in an attestation index that Lambda refuses.
      - name: Build and push ${{ matrix.target }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          tag=${{ matrix.target }}-$sha
          if aws ecr describe-images --repository-name catherder --image-ids imageTag="$tag" > /dev/null 2>&1; then
            echo "$tag is already in the registry"
            exit 0
          fi
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false --target ${{ matrix.target }} -t "$REGISTRY/catherder:$tag" --push .

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: dev
      url: https://dev.catherderapp.com

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Resolve image tags
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          repo=$(aws ecr describe-repositories --repository-names catherder --query 'repositories[0].repositoryUri' --output text)
          echo "MIGRATE_IMAGE=$repo:migrate-$sha" >> "$GITHUB_ENV"
          echo "APP_IMAGE=$repo:app-$sha" >> "$GITHUB_ENV"

      # Lambda refuses a second update while one is in progress, so every update waits for completion.
      - name: Update the migrate function
        run: |
          aws lambda update-function-code --function-name catherder-dev-migrate --image-uri "$MIGRATE_IMAGE" --query FunctionName --output text
          aws lambda wait function-updated-v2 --function-name catherder-dev-migrate

      # Migrations run before the new app image takes traffic; a failed migration stops the deploy here.
      # The payload holds migration names only, never a secret.
      - name: Run migrations
        run: |
          aws lambda invoke --function-name catherder-dev-migrate --cli-read-timeout 330 migrate-out.json > invoke.json
          cat invoke.json
          cat migrate-out.json
          if ! jq -e '.FunctionError == null' invoke.json > /dev/null || ! jq -e '.ok == true' migrate-out.json > /dev/null; then
            echo "migration failed; the app image was not updated"
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - run: terraform init -input=false -backend-config backend.dev.hcl
        working-directory: infra/aws/app

      # Applies whatever infrastructure changed in this merge; image tags are not Terraform's to change (see the lifecycle blocks).
      - run: terraform apply -input=false -auto-approve -no-color -var-file dev.tfvars
        working-directory: infra/aws/app

      - name: Update the app function
        run: |
          aws lambda update-function-code --function-name catherder-dev-app --image-uri "$APP_IMAGE" --query FunctionName --output text
          aws lambda wait function-updated-v2 --function-name catherder-dev-app

      # Retries cover the cold start.
      - name: Smoke check
        run: |
          curl -sS --fail --retry 6 --retry-delay 10 --retry-all-errors https://dev.catherderapp.com/api/health
          curl -sS --fail https://dev.catherderapp.com/ | grep -q catherder
